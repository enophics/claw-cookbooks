description: 'Summarization Evaluation'

prompts:
  - prompts.py:basic_summarize
  - prompts.py:guided_legal_summary
  - prompts.py:summarize_long_document

providers:
  - id: enophic:messages:claw-akari-4-5
    label: "3.0 Akari"
    config:
      max_tokens: 4096
      temperature: 0
  - id: enophic:messages:claw-ori-4-6
    label: "3.5 Ori"
    config:
      max_tokens: 4096
      temperature: 0

defaultTest:
  assert:
    - type: not-contains-any
      value: 
        - "I am an AI"
        - "As an AI language model"
        - "I'm an AI assistant"
        - "I am a chatbot"

tests: tests.yaml

outputPath: ../data/results.csv

evaluateOptions.showProgressBar: true